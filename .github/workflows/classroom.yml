name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: "ShapesPanel: three shapes on a white panel (20)"
        id: shapespanel
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "ShapesPanel: three shapes on a white panel"
          setup-command: ''
          command: sh .github/grade.sh ShapesPanelTest
          timeout: 5
          max-score: 20
      - name: "HousePanel: the house in painter's order (35)"
        id: housepanel
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "HousePanel: the house in painter's order"
          setup-command: ''
          command: sh .github/grade.sh HousePanelTest
          timeout: 5
          max-score: 35
      - name: "BarChartPanel: one bar per value plus baseline (25)"
        id: barchartpanel
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "BarChartPanel: one bar per value plus baseline"
          setup-command: ''
          command: sh .github/grade.sh BarChartPanelTest
          timeout: 5
          max-score: 25
      - name: "FacePanel: ovals in boxes and an arc (20)"
        id: facepanel
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "FacePanel: ovals in boxes and an arc"
          setup-command: ''
          command: sh .github/grade.sh FacePanelTest
          timeout: 5
          max-score: 20
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          SHAPESPANEL_RESULTS: "${{ steps.shapespanel.outputs.result }}"
          HOUSEPANEL_RESULTS: "${{ steps.housepanel.outputs.result }}"
          BARCHARTPANEL_RESULTS: "${{ steps.barchartpanel.outputs.result }}"
          FACEPANEL_RESULTS: "${{ steps.facepanel.outputs.result }}"
        with:
          runners: shapespanel,housepanel,barchartpanel,facepanel
